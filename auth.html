<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funngro Systems - Access Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#030712] font-sans antialiased text-slate-200 min-h-screen flex items-center justify-center relative overflow-hidden px-4">

    <div class="absolute top-[-10%] left-[-10%] w-[600px] h-[600px] bg-emerald-500/10 rounded-full blur-[150px] -z-10 pointer-events-none"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[600px] h-[600px] bg-indigo-600/10 rounded-full blur-[150px] -z-10 pointer-events-none"></div>

    <div class="w-full max-w-md glass-card rounded-2xl border border-white/10 p-8 glow-indigo relative z-10">
        
        <div class="flex flex-col items-center text-center mb-8">
            <a href="index.html" class="flex items-center gap-3 mb-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-500 to-indigo-500 flex items-center justify-center shadow-lg">
                    <i class="fa-solid fa-wind text-white text-base"></i>
                </div>
                <span class="font-heading font-extrabold text-2xl bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">Funngro</span>
            </a>
            <p class="text-xs text-slate-400" id="auth-subtitle">Secure gateway to cloud infrastructure pipelines</p>
        </div>

        <div id="login-form" class="block space-y-5">
            <h2 class="font-heading font-bold text-xl text-white tracking-tight">Account Sign In</h2>
            
            <form onsubmit="handleAuthRedirect(event)" class="space-y-4">
                <div class="space-y-1.5">
                    <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wide">Workspace Email</label>
                    <div class="relative flex items-center">
                        <i class="fa-regular fa-envelope text-slate-500 text-sm absolute ml-3.5"></i>
                        <input type="email" required placeholder="name@company.com" class="w-full bg-slate-900/60 border border-white/5 rounded-xl pl-10 pr-4 py-3 text-xs text-slate-300 focus:outline-none focus:border-emerald-500/40">
                    </div>
                </div>

                <div class="space-y-1.5">
                    <div class="flex justify-between items-center">
                        <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wide">Password</label>
                        <a href="#" class="text-[11px] text-emerald-400 hover:underline">Forgot?</a>
                    </div>
                    <div class="relative flex items-center">
                        <i class="fa-solid fa-lock text-slate-500 text-sm absolute ml-3.5"></i>
                        <input type="password" required placeholder="••••••••" class="w-full bg-slate-900/60 border border-white/5 rounded-xl pl-10 pr-4 py-3 text-xs text-slate-300 focus:outline-none focus:border-emerald-500/40">
                    </div>
                </div>

                <button type="submit" class="w-full py-3 mt-2 bg-gradient-to-r from-emerald-500 to-teal-600 hover:brightness-110 text-white font-bold text-xs rounded-xl shadow-lg shadow-emerald-500/15 transition-all flex items-center justify-center gap-2">
                    Authenticate Session <i class="fa-solid fa-arrow-right text-[10px]"></i>
                </button>
            </form>

            <div class="text-center pt-2">
                <p class="text-xs text-slate-500">
                    New to the platform? 
                    <button onclick="toggleAuthMode('signup')" class="text-emerald-400 font-semibold hover:underline ml-1">Create an account</button>
                </p>
            </div>
        </div>

        <div id="signup-form" class="hidden space-y-5">
            <h2 class="font-heading font-bold text-xl text-white tracking-tight">Register Node Core</h2>
            
            <form onsubmit="handleAuthRedirect(event)" class="space-y-4">
                <div class="space-y-1.5">
                    <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wide">Full Name</label>
                    <div class="relative flex items-center">
                        <i class="fa-regular fa-user text-slate-500 text-sm absolute ml-3.5"></i>
                        <input type="text" required placeholder="John Doe" class="w-full bg-slate-900/60 border border-white/5 rounded-xl pl-10 pr-4 py-3 text-xs text-slate-300 focus:outline-none focus:border-emerald-500/40">
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wide">Work Email Address</label>
                    <div class="relative flex items-center">
                        <i class="fa-regular fa-envelope text-slate-500 text-sm absolute ml-3.5"></i>
                        <input type="email" required placeholder="name@company.com" class="w-full bg-slate-900/60 border border-white/5 rounded-xl pl-10 pr-4 py-3 text-xs text-slate-300 focus:outline-none focus:border-emerald-500/40">
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wide">Choose Access Password</label>
                    <div class="relative flex items-center">
                        <i class="fa-solid fa-lock text-slate-500 text-sm absolute ml-3.5"></i>
                        <input type="password" required placeholder="Minimum 8 characters" class="w-full bg-slate-900/60 border border-white/5 rounded-xl pl-10 pr-4 py-3 text-xs text-slate-300 focus:outline-none focus:border-emerald-500/40">
                    </div>
                </div>

                <div class="flex items-start gap-2 pt-1">
                    <input type="checkbox" required class="mt-0.5 w-3.5 h-3.5 accent-emerald-500 rounded bg-slate-900 border border-white/10 cursor-pointer">
                    <label class="text-[10px] text-slate-500 leading-normal">I agree to the standard platform architecture Terms of Service and Master SLA Protocols.</label>
                </div>

                <button type="submit" class="w-full py-3 mt-2 bg-gradient-to-r from-emerald-500 to-teal-600 hover:brightness-110 text-white font-bold text-xs rounded-xl shadow-lg shadow-emerald-500/15 transition-all flex items-center justify-center gap-2">
                    Initialize Cluster Access <i class="fa-solid fa-circle-check text-[10px]"></i>
                </button>
            </form>

            <div class="text-center pt-2">
                <p class="text-xs text-slate-500">
                    Already registered? 
                    <button onclick="toggleAuthMode('login')" class="text-emerald-400 font-semibold hover:underline ml-1">Sign in instead</button>
                </p>
            </div>
        </div>

    </div>

    <script>
        // Smoothly Switch between Login and Signup panels
        function toggleAuthMode(mode) {
            const loginBox = document.getElementById('login-form');
            const signupBox = document.getElementById('signup-form');
            const subtitle = document.getElementById('auth-subtitle');

            if (mode === 'signup') {
                loginBox.classList.replace('block', 'hidden');
                signupBox.classList.replace('hidden', 'block');
                subtitle.textContent = "Deploy your workspace pipeline nodes profile";
            } else {
                signupBox.classList.replace('block', 'hidden');
                loginBox.classList.replace('hidden', 'block');
                subtitle.textContent = "Secure gateway to cloud infrastructure pipelines";
            }
        }

        // Simulate form processing and redirect straight into dashboard.html
        function handleAuthRedirect(event) {
            event.preventDefault(); // Stop page reload
            
            // Tum yahan chaho toh loading effect add kar sakte ho
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
